<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FreeLLM — self-hosted OpenAI-compatible LLM gateway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0c0a"/>
      <stop offset="1" stop-color="#12160f"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bef264"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <ellipse cx="980" cy="180" rx="420" ry="300" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(88,150)">
    <rect x="-2" y="-2" width="64" height="64" rx="16" fill="url(#lime)"/>
    <path d="M34 12 L20 36 L31 36 L28 52 L42 26 L31 26 Z" fill="#0a0c0a" stroke="#0a0c0a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="172" y="178" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f5f7f2" letter-spacing="-1.5">FreeLLM</text>
  <text x="174" y="218" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#9aa395">Self-hosted, OpenAI-compatible LLM gateway</text>

  <!-- feature pills -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
    <g transform="translate(174,250)">
      <rect width="186" height="34" rx="17" fill="#a3e635" fill-opacity="0.12" stroke="#a3e635" stroke-opacity="0.35"/>
      <text x="93" y="22" text-anchor="middle" fill="#bef264">Policy-driven routing</text>
    </g>
    <g transform="translate(372,250)">
      <rect width="172" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="86" y="22" text-anchor="middle" fill="#c7cdbf">Cost &amp; quota control</text>
    </g>
    <g transform="translate(556,250)">
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="75" y="22" text-anchor="middle" fill="#c7cdbf">Full ops console</text>
    </g>
  </g>

  <!-- routing topology motif -->
  <g transform="translate(880,80)" stroke-linecap="round">
    <!-- gateway node -->
    <circle cx="40" cy="100" r="26" fill="#12160f" stroke="url(#lime)" stroke-width="2.5"/>
    <path d="M44 88 L34 106 L42 106 L39 116 L50 98 L42 98 Z" fill="url(#lime)"/>
    <!-- links -->
    <path d="M66 100 C 150 100, 180 30, 280 30" stroke="#a3e635" stroke-opacity="0.55" stroke-width="2" fill="none"/>
    <path d="M66 100 C 150 100, 180 100, 280 100" stroke="#a3e635" stroke-opacity="0.8" stroke-width="2.5" fill="none"/>
    <path d="M66 100 C 150 100, 180 170, 280 170" stroke="#a3e635" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    <!-- model nodes -->
    <g font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9aa395" text-anchor="start">
      <circle cx="296" cy="30" r="9" fill="#1a1f15" stroke="#9aa395" stroke-width="1.5"/>
      <text x="314" y="34">provider A</text>
      <circle cx="296" cy="100" r="11" fill="#1a1f15" stroke="#bef264" stroke-width="2"/>
      <text x="316" y="104" fill="#c7cdbf">provider B</text>
      <circle cx="296" cy="170" r="9" fill="#1a1f15" stroke="#9aa395" stroke-width="1.5"/>
      <text x="314" y="174">provider C</text>
    </g>
  </g>
</svg>
