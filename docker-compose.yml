# FreeLLM 一键编排（Docker Compose v2）。
# 用法：
#   1. cp .env.example .env  并填好 FREELLM_MASTER_KEY / SESSION_SECRET / ADMIN_PASSWORD
#   2. docker compose up -d --build
#   3. curl http://127.0.0.1:3001/health
#
# 端口策略：
# - API 暴露在宿主 127.0.0.1:3001（仅 loopback，公网入口由 Caddy 反代 :28000 处理）
# - Web 暴露在宿主 127.0.0.1:8080（公网入口由 Caddy 反代 :28010）
# - **不要**把 ports 改成 0.0.0.0:xxxx，宿主防火墙的 loopback 盲区会让你出事。

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: freellm-api:0.9.2
    container_name: freellm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FREELLM_API_HOST: 0.0.0.0
      FREELLM_API_PORT: 3001
      FREELLM_NODE_ENV: production
      DATABASE_URL: file:/app/data/freellm.db
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - freellm

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: freellm-web:0.9.2
    container_name: freellm-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - freellm

networks:
  freellm:
    driver: bridge
