server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Cache static assets aggressively, hash-busted by Vite build.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  # SPA fallback — everything else returns index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
